    <style>
      /* Loading inicial: fica dentro do #app e some quando o Vue monta */
      body { margin: 0; background-color: #220c3a; }
      .app-loading { position: fixed; inset: 0; display: grid; place-items: center; }
      .app-loading span {
        width: 48px; height: 48px; border-radius: 50%;
        border: 3px solid rgba(26, 235, 195, 0.2); border-top-color: #1aebc3;
        animation: app-loading-spin 0.8s linear infinite;
      }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .app-loading span { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <noscript>

      <p>Resume: <a href="/carloshallan-resume-en.pdf">English (PDF)</a> · <a href="/carloshallan-resume-pt-br.pdf">Português (PDF)</a></p>

    </noscript>
    <div id="app">
      <div class="app-loading" role="status" aria-label="Loading"><span></span></div>
